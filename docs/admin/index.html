<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>커넥션센스 관리자 콘솔</title>
<!-- 폰트는 앱과 동일하게 Pretendard로 통일한다(사용자 지정). 시스템에 없어도
     항상 같은 서체로 보이도록 CDN 스타일시트를 직접 로드한다. -->
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
/* ── 검정 기준 엔터프라이즈 콘솔 테마 ──────────────────────────────
   설계 의도: "AI스럽지 않게" = 그라디언트·네온·보라 대신 near-black 배경 +
   1px 크리스프 경계 + 단일 블루 포인트 + 상태색(초록/앰버/빨강)만 색을 쓴다.
   ⚠️ CSS 변수명과 컴포넌트 클래스명(.card, .list-item, .badge, .btn-primary,
   .bubble 등)은 admin.js가 innerHTML로 그대로 쓰므로 이름은 유지하고 값만
   검정 테마로 바꾼다.
   좌측 사이드바는 sticky로 고정, 본문(.main)만 독립 스크롤 — 자료가 많아져도
   내비게이션이 늘 보이고 목록은 본문 안에서만 스크롤된다. */
:root{
  --bg:#0B0B0D; --paper:#161619; --paper-2:#1F1F24;
  --sidebar:#0F0F12; --topbar:#101014;
  --border:#2A2A31; --border-strong:#3A3A44;
  --ink:#ECECEF; --ink-dim:#A6A6B0; --ink-faint:#8A8A96;
  --brand:#4C8DFF; --brand-deep:#3B7BEE; --brand-soft:#182741; --brand-ink:#CFE0FF;
  --warn:#F5B841; --warn-soft:#2C2410;
  --bad:#F87171; --bad-soft:#331B1C;
  --good:#34D399; --good-soft:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -28px rgba(0,0,0,.8);
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; font-family:var(--font-ui); background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;}
h1{font-size:19px; margin:0 0 4px; letter-spacing:-.01em;}
h3{font-size:14.5px; letter-spacing:-.01em;}
.sub{color:var(--ink-faint); font-size:12.5px; margin-bottom:24px;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--brand-soft); color:var(--brand-ink);}

/* ── 공통 컴포넌트(이름 유지, 값만 변경) ── */
.card{background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px;}
.card h3:first-child, .card h2:first-child{margin-top:0;}
label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-dim); margin:16px 0 6px; text-transform:none;}
label:first-child{margin-top:0;}
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  background:var(--paper-2); color:var(--ink); font-family:inherit; font-size:13.5px; transition:border-color .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder{color:var(--ink-faint);}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(76,141,255,.18);}
textarea{min-height:140px; resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.5;}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%); background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px;}
button{cursor:pointer; border:none; border-radius:8px; padding:10px 16px; font-weight:700; font-size:13px; font-family:inherit; transition:background .15s, border-color .15s, color .15s, opacity .15s;}
.btn-primary{background:var(--brand); color:#08121F;}
.btn-primary:hover{background:var(--brand-deep); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border-strong); color:var(--ink);}
.btn-danger{background:var(--bad-soft); color:var(--bad); border:1px solid transparent;}
.btn-danger:hover{border-color:var(--bad);}
button:disabled{opacity:.45; cursor:not-allowed;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.checkbox-row{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; color:var(--ink-dim);}
.checkbox-row input{width:auto;}
input[type=checkbox]{accent-color:var(--brand);}
/* 빌드번호 입력을 2행×2열(iOS 행 / Android 행)로 묶는 그리드 — 4줄 세로
   나열 대신 화면을 덜 쓴다. "앱 업데이트" 탭에서 admin.js가 렌더하는
   .field-2col > div > (.field-sublabel + input) 구조에 쓰인다(PR #117 연동). */
.field-2col{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; margin-top:6px;}
.field-2col input{max-width:160px;}
.field-sublabel{display:block; font-size:10.5px; font-weight:700; color:var(--ink-faint); margin-bottom:4px;}

.error{background:var(--bad-soft); color:var(--bad); border:1px solid rgba(248,113,113,.3); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-top:12px;}
.hint{color:var(--ink-faint); font-size:11.5px; margin-top:6px;}

/* 목록 항목: 자료가 많아질 때를 대비해 조금 더 촘촘하게 + 호버 피드백 */
.list-item{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:12px 10px; margin:0 -10px; border-bottom:1px solid var(--border); border-radius:8px; transition:background .12s;}
.list-item:hover{background:var(--paper-2);}
.list-item:last-child{border-bottom:none;}
.list-item .title{font-weight:700; font-size:13.5px;}
.list-item .meta{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
.badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700; border:1px solid transparent;}
.badge.good{background:var(--good-soft); color:var(--good); border-color:rgba(52,211,153,.28);}
.badge.warn{background:var(--warn-soft); color:var(--warn); border-color:rgba(245,184,65,.28);}
.badge.bad{background:var(--bad-soft); color:var(--bad); border-color:rgba(248,113,113,.28);}

/* 데이터 테이블(향후 admin.js가 나열식 대신 채택할 수 있는 스케일용 스타일).
   thead가 스크롤 시 상단에 고정돼 행이 많아도 헤더를 잃지 않는다. */
.data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.data-table th{position:sticky; top:0; z-index:1; text-align:left; font-size:11px; letter-spacing:.02em; color:var(--ink-faint); font-weight:700; padding:9px 12px; background:var(--paper); border-bottom:1px solid var(--border-strong);}
.data-table td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
.data-table tbody tr:hover{background:var(--paper-2);}
.scroll-y{max-height:60vh; overflow:auto; border:1px solid var(--border); border-radius:10px;}

.thread{display:flex; flex-direction:column; gap:10px; margin:16px 0;}
.bubble{max-width:80%; padding:10px 13px; border-radius:12px; font-size:13px; white-space:pre-wrap;}
.bubble.user{align-self:flex-start; background:var(--paper-2); border:1px solid var(--border);}
.bubble.admin{align-self:flex-end; background:var(--brand-soft); color:var(--brand-ink); border:1px solid rgba(76,141,255,.25);}

/* ── 로그인 화면(검정 테마, 가운데) — ID/구조는 유지 ──
   ⚠️ flex로 세로중앙정렬을 하면 admin.js가 로그아웃 시 세팅하는 인라인
   display:block에 덮여 정렬이 깨진다. block 레이아웃과 충돌하지 않도록
   margin auto + 상단 여백으로 배치한다. */
#loginScreen{max-width:380px; margin:0 auto; padding:9vh 20px 60px;}

/* ── 대시보드 셸: 좌측 사이드바 + 독립 스크롤 본문 ── */
#dashboard{display:none;}
#dashboard.visible{display:flex; min-height:100vh;}

.sidebar{width:236px; flex:0 0 236px; background:var(--sidebar); border-right:1px solid var(--border); position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
.brand{display:flex; align-items:center; gap:11px; padding:20px 18px 16px;}
.brand-mark{width:32px; height:32px; flex:0 0 32px; border-radius:9px; background:var(--brand-soft); border:1px solid rgba(76,141,255,.35); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.brand-text{display:flex; flex-direction:column; line-height:1.25;}
.brand-text b{font-size:14px; letter-spacing:-.01em;}
.brand-text span{font-size:10.5px; color:var(--ink-faint);}
.nav{display:flex; flex-direction:column; gap:2px; padding:8px; overflow-y:auto; flex:1;}
.nav .cap{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:12px 12px 6px;}
/* .tab-btn: 가로 탭 → 세로 사이드바 항목으로 재정의. admin.js는 .tab-btn +
   data-tab + .active만 참조하므로 모양만 바뀌고 동작은 그대로다. */
.tab-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:none; border-radius:8px; padding:9px 12px; color:var(--ink-dim); font-weight:600; font-size:13px; line-height:1;}
.tab-btn svg{width:17px; height:17px; flex:0 0 17px; stroke-width:1.9; opacity:.8;}
.tab-btn:hover{background:var(--paper-2); color:var(--ink);}
.tab-btn.active{background:var(--brand-soft); color:var(--brand-ink);}
.tab-btn.active svg{opacity:1; color:var(--brand);}
.sidebar-foot{border-top:1px solid var(--border); padding:12px; display:flex; flex-direction:column; gap:8px;}
.sidebar-foot .who{font-size:11.5px; color:var(--ink-faint); padding:2px 4px; word-break:break-all;}
.sidebar-foot .btn-ghost{width:100%; text-align:center;}

.main{flex:1; min-width:0; height:100vh; overflow-y:auto;}
.main-inner{max-width:1160px; margin:0 auto; padding:26px 30px 80px;}

/* 폼 위주 패널은 지나치게 넓어지지 않게 카드 폭을 제한한다(필드 순서·구성은
   admin.js가 렌더하므로 그대로, 배치만 읽기 좋게). 데이터/로그 패널은 전체 폭. */
#tab-appupdate .card, #tab-notices .card, #tab-legal .card,
#tab-billing .card, #tab-ocr .card{max-width:760px;}

/* ── 반응형: 좁은 화면에서는 사이드바를 상단 가로 내비로 ── */
@media (max-width:860px){
  #dashboard.visible{flex-direction:column;}
  .sidebar{width:auto; flex:none; height:auto; position:sticky; top:0; z-index:5; border-right:none; border-bottom:1px solid var(--border);}
  .brand{padding:12px 16px;}
  .nav{flex-direction:row; overflow-x:auto; padding:6px 10px; gap:4px;}
  .nav .cap{display:none;}
  .tab-btn{width:auto; white-space:nowrap; padding:8px 12px;}
  .sidebar-foot{flex-direction:row; align-items:center; justify-content:space-between;}
  .sidebar-foot .btn-ghost{width:auto;}
  .main{height:auto; overflow:visible;}
  .main-inner{padding:20px 16px 64px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div id="loginScreen">
  <div style="text-align:center; margin-bottom:20px;">
    <div class="brand-mark" style="width:44px;height:44px;font-size:18px;border-radius:12px;margin:0 auto 14px;">CS</div>
    <h1>커넥션센스 관리자 콘솔</h1>
    <p class="sub" style="margin-bottom:0;">공지 · 문의 · 정산 · 운영 데이터를 관리합니다.</p>
  </div>
  <div class="card">
    <label for="loginEmail">이메일</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label for="loginPassword">비밀번호</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <div id="signupFields" style="display:none;">
      <label for="signupPasswordConfirm">비밀번호 확인</label>
      <input type="password" id="signupPasswordConfirm" autocomplete="new-password">
      <p class="hint">등록된 이메일로 가입해야만 관리자 권한이 생깁니다.</p>
    </div>
    <div class="row" style="margin-top:18px;">
      <button class="btn-primary" id="loginBtn">로그인</button>
      <button class="btn-primary" id="signupBtn" style="display:none;">가입하기</button>
      <button class="btn-ghost" id="signupToggle" type="button">회원가입</button>
    </div>
    <div style="display:flex; align-items:center; gap:10px; margin:16px 0;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span class="hint" style="margin:0;">또는</span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>
    <button class="btn-ghost" id="googleLoginBtn" type="button" style="width:100%;">
      Google 계정으로 로그인
    </button>
    <div id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CS</div>
      <div class="brand-text"><b>커넥션센스</b><span>관리자 콘솔</span></div>
    </div>
    <nav class="nav">
      <div class="cap">운영</div>
      <button class="tab-btn active" data-tab="notices" title="공지사항">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l14-7v16L3 13z"/><path d="M3 11v2M8 13v5a2 2 0 0 0 4 0"/></svg>공지사항</button>
      <button class="tab-btn" data-tab="inquiries" title="1:1 문의">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>1:1 문의</button>
      <button class="tab-btn" data-tab="legal" title="법적 문서">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>법적 문서</button>
      <div class="cap">비즈니스</div>
      <button class="tab-btn" data-tab="reports" title="경영 리포트">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg>경영 리포트</button>
      <button class="tab-btn" data-tab="billing" title="충전 관리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>충전 관리</button>
      <div class="cap">운영 데이터</div>
      <button class="tab-btn" data-tab="testers" title="테스터 관리">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>테스터 관리</button>
      <button class="tab-btn" data-tab="usage" title="사용량·로그">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>사용량·로그</button>
      <button class="tab-btn" data-tab="ocr" title="명함 인식">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h6M15 9h2"/></svg>명함 인식</button>
      <div class="cap">배포</div>
      <button class="tab-btn" data-tab="appupdate" title="앱 업데이트">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>앱 업데이트</button>
    </nav>
    <div class="sidebar-foot">
      <span class="who" id="whoAmI"></span>
      <button class="btn-ghost" id="logoutBtn">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div id="tab-notices" class="tab-panel"></div>
      <div id="tab-inquiries" class="tab-panel" style="display:none;"></div>
      <div id="tab-legal" class="tab-panel" style="display:none;"></div>
      <div id="tab-reports" class="tab-panel" style="display:none;"></div>
      <div id="tab-billing" class="tab-panel" style="display:none;"></div>
      <div id="tab-testers" class="tab-panel" style="display:none;"></div>
      <div id="tab-usage" class="tab-panel" style="display:none;"></div>
      <div id="tab-ocr" class="tab-panel" style="display:none;"></div>
      <div id="tab-appupdate" class="tab-panel" style="display:none;"></div>
    </div>
  </main>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
