# 커밋·PR마다 정적 분석과 테스트를 자동으로 돌려 회귀를 막는다.
#
# 왜 필요한가(backlog 추가 81): 지금까지 `flutter analyze`와 `flutter test`가
# "사람이 기억해서 돌릴 때만" 돌았다. 테스트가 아무리 많아도 실행되지 않으면
# 없는 것과 같다.
#
# 실기기가 필요한 검증(카메라·OCR·위치·Firestore 실물 대조)은 여기서 돌릴 수
# 없다 — 그건 릴리스 체크리스트(P1-30)와 실물 점검 스크립트(P1-29)의 몫이다.
# 이 워크플로가 잡는 것은 "컴파일·정적 분석·순수 로직" 계층까지다.
#
# ⚠️ 이 파일을 고쳐서 푸시하려면 GitHub 토큰에 `workflow` 스코프가 있어야 한다.
# 없으면 푸시가 거부된다(다른 파일은 멀쩡히 올라가므로 원인을 찾기 어렵다).
# 복구: gh auth refresh -h github.com -s workflow

name: CI

# ⚠️ 언제 도는가 — 2026-08-16에 무료 사용량이 바닥나 한 번 고쳤다.
#
# 그날 하루에 여러 세션이 붙어 PR을 쏟아내면서 **3일 만에 $5.3**을 썼고
# (그 전 열흘은 하루 $0.2~0.7), 무료분 $12가 다 차 **CI가 통째로 멈췄다.**
# 잡이 시작조차 못 하니 빨간 X가 뜨는데, 그건 "테스트가 실패했다"가 아니라
# **"테스트가 돌지 않았다"**여서 원인을 코드에서 찾게 된다.
#
# 무엇이 낭비였나:
#
# - **문서만 고친 PR에도** Flutter를 설치하고 테스트 513건을 다 돌렸다.
#   이 저장소는 기록을 코드와 함께 갱신하므로 문서 PR이 많다
# - `backlog.md`는 새 항목이 **맨 위에 삽입**되는 구조라 세션이 여럿이면
#   충돌이 반복된다. 풀어서 다시 푸시할 때마다 처음부터 다시 돌았다
#   (하루 여섯 번)
# - 브랜치 push와 PR이 **각각** 돌아 같은 코드를 두 번 검사했다
#
# 그래서 아래 셋을 걸었다. **코드가 바뀌는 PR은 전과 똑같이 전부 검사받는다** —
# 줄인 것은 "같은 것을 여러 번"과 "볼 필요 없는 것"뿐이다.
on:
  # 브랜치 push에는 안 돈다(아래 main 제외). 어차피 PR에서 도는데 두 번
  # 돌릴 이유가 없다. 대신 **PR을 열기 전에는 검사 결과가 없다**는 뜻이므로,
  # 로컬에서 `flutter analyze`·`flutter test`를 돌리는 습관은 그대로 필요하다.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  pull_request:
    branches: [main]
    # ⚠️ 문서만 바뀐 PR은 건너뛴다. `flutter test`가 문서를 검사하지 않으므로
    # 잃는 것이 없다. 코드가 한 줄이라도 섞이면 이 필터에 걸리지 않아
    # 평소대로 전부 돈다.
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다(무료 사용량 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: 정적 분석 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          # 로컬 개발 환경과 같은 버전으로 고정한다. 버전이 갈리면 CI만
          # 통과하거나 CI만 실패하는 상황이 생긴다.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: 의존성 내려받기
        run: flutter pub get

      - name: 정적 분석
        # --no-fatal-infos: 현재 info 19건(스타일 지적, 웹 전용 코드 경고 등)이
        # 남아 있어 그대로 두면 CI가 항상 빨간불이 된다. error·warning은
        # 여전히 실패로 처리되므로 진짜 문제는 걸린다.
        # info 정리는 별도 항목(P2-8 등)으로 진행한다.
        run: flutter analyze --no-fatal-infos

      - name: 테스트
        run: flutter test --reporter expanded

      - name: Node 설치
        # functions/package.json이 `engines.node: 22`를 요구한다. 러너 기본
        # 버전에 기대면 러너가 바뀌는 날 CI만 깨진다 — Flutter 버전을 3.44.8로
        # 고정한 것과 같은 이유다.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Cloud Functions 테스트
        # 🚨 2026-09-05까지 이 단계가 없었다. `functions/`에 테스트가 17개
        # 있고 `npm test`에 등록까지 돼 있었는데 **CI가 한 번도 안 돌렸다** —
        # 즉 서버 쪽 로직(과금·지갑·OTP·소셜 로그인)은 누군가 손으로 돌려야만
        # 검증됐다. 관리자 인증(adminAuth.ts)이 바로 그 자리에 들어가면서
        # 드러났다.
        #
        # ⚠️ **`flutter test`가 이것을 대신해 주지 않는다** — 서로 다른 언어의
        # 서로 다른 코드다. 통과 건수가 늘어도 서버 쪽은 그대로 0건이었다.
        #
        # `npm ci`는 lockfile 그대로 설치하므로 재현 가능하고, 스크립트가
        # `tsc`를 먼저 돌려 **타입 오류도 여기서 걸린다**(functions 쪽에는
        # `flutter analyze`에 해당하는 단계가 따로 없다).
        working-directory: functions
        run: npm ci --no-audit --no-fund && npm test

      - name: 관리자 이메일 동기화 검사
        # firestore.rules의 isAdmin()과 functions/src/adminEmails.ts의
        # ADMIN_EMAILS가 갈라지면 관리자 해제가 일부만 반영되는 사고가 난다
        # (ADMIN-VULN-001). 표준 라이브러리만 쓰는 순수 로컬 파일 비교라
        # 운영 Firestore·firebase login 없이 ubuntu-latest 기본 python3로
        # 바로 돈다.
        run: python3 tool/check_admin_sync.py
