name: connection_trace_ai_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.5
  # main.dart에서 FlutterNativeSplash.preserve()/.remove()를 런타임에 직접
  # 호출해 페이드아웃 전환을 구현하므로(SplashGate) 빌드 시점에만 쓰이는
  # dev_dependencies가 아니라 dependencies에 있어야 함.
  flutter_native_splash: ^2.4.6
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  # 내 프로필 사진을 앱 저장소에 영구 보관하기 위한 문서 디렉터리 접근.
  path_provider: ^2.1.5
  # 사용자가 선택한 이메일 가져오기 — Gmail API + OAuth(google_sign_in). 모든 플랫폼에서
  # 동작하지만, Google Cloud Console에서 OAuth 클라이언트 ID를 먼저 발급받아야
  # 실제로 로그인이 된다(코드만으론 안 되는 부분 — README/오류노트 참고).
  google_sign_in: ^7.2.0
  http: ^1.2.0
  # 명함 스캔 화면에서 실제 후면 카메라 실시간 프리뷰를 보여주고, 가이드 프레임에
  # 맞춰 촬영 결과를 크롭하기 위한 패키지들.
  camera: ^0.11.0+2
  image: ^4.3.0
  # 디지털 명함 QR 코드 표시(qr_flutter)와 상대방 QR 코드 실시간 스캔(mobile_scanner).
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  # 도로명주소 검색 — 다음(카카오) 우편번호 서비스를 웹뷰로 띄운다. API 키가
  # 필요 없는 무료 공개 서비스라 별도 개발자 계정 설정 없이 바로 쓸 수 있다.
  webview_flutter: ^4.10.0
  # AI 연동(Claude/OpenAI/Gemini) API 키를 기기 키체인/키스토어에 안전하게
  # 저장하기 위한 패키지 — shared_preferences는 평문 저장이라 API 키 같은
  # 민감정보에는 부적합.
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  # 명함/프로필(제3자 개인정보) 기기·서버 저장 시 AES-256-GCM 암호화용.
  # pure Dart 구현이라 플랫폼별 네이티브 바인딩 문제가 없다.
  cryptography: ^2.9.0
  cloud_functions: ^6.3.6
  # Sign in with Apple(App Store Review Guideline 4.8 대응, iOS/macOS 전용).
  # PKCE 유사 nonce 검증에 필요한 raw nonce SHA-256 해시를 crypto 패키지로 만든다.
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # 앱 아이콘(커넥션센스) 생성 — tool/generate_app_icon.dart로 만든
  # assets/icon/icon_full.png(iOS·Android 레거시)와
  # icon_foreground.png(Android adaptive icon)를 실제 아이콘 사이즈셋으로 변환한다.
  flutter_launcher_icons: ^0.14.4

# path_provider_foundation 2.6.0부터 objective_c(Dart 네이티브 에셋/FFI 브리징) 의존이
# 추가됐는데, 이 Flutter SDK(3.44.8)의 native-assets 처리기가 objective_c의
# 아키텍처별 프레임워크 이름 불일치(objective_c.framework vs objective_c1.framework)를
# 파싱하다 "Null check operator used on a null value"로 크래시하는 툴체인 버그가 있음
# (iOS 시뮬레이터 빌드 시 100% 재현). google_fonts가 path_provider를 통해 이를
# 전이 의존하므로, objective_c 의존이 없는 마지막 버전으로 고정해서 우회한다.
dependency_overrides:
  path_provider_foundation: 2.5.1

# 앱 최초 로딩 시(엔진 초기화가 끝나기도 전에) 보이는 네이티브 스플래시 화면 설정.
# `dart run flutter_native_splash:create`를 실행하면 이 설정을 읽어 Android/iOS/Web
# 각 플랫폼용 스플래시 리소스를 실제로 생성한다. 2026-08-04, 사용자 요청으로
# 기존 퍼블리셔 CI 로고(assets/CI.png, "CREAMHOUSE" 워드마크) 대신 새 앱
# 아이콘 시안(라벤더 글라스, 옵션 A)을 스플래시 이미지로 사용하도록 교체.
flutter_native_splash:
  color: "#F7F8FA"
  image: assets/icons3d/radar_lavender_splash.png
  color_dark: "#F7F8FA"
  image_dark: assets/icons3d/radar_lavender_splash.png
  android_12:
    color: "#F7F8FA"
    image: assets/icons3d/radar_lavender_splash.png
    color_dark: "#F7F8FA"
    image_dark: assets/icons3d/radar_lavender_splash.png
  web: true

# 앱 아이콘(커넥션센스) 설정. 2026-08-04, 사용자가 밝은 계통 샘플 5종(A~E) 중
# A(라벤더 글라스)를 최종 선택 — assets/icons3d/radar_lavender_full_bleed.png
# (그라디언트 배경이 캔버스 전체를 채우는 풀블리드 정사각형, OS가 각자의
# 마스크 모양으로 코너를 잘라내는 방식)로 교체.
flutter_launcher_icons:
  image_path: "assets/icons3d/radar_lavender_full_bleed.png"
  ios: true
  remove_alpha_ios: true
  android: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # FlutterGeneratedPluginSwiftPackage가 iOS 최소 버전을 Flutter SDK에
  # 하드코딩된 13.0으로 생성해서 Firebase 패키지(최소 15.0 요구)와 항상
  # 충돌한다(Flutter 3.44.8, flutter_tools/lib/src/darwin/darwin.dart
  # deploymentTarget()). 프로젝트 설정(Podfile 등)으로는 못 고치는 SDK
  # 자체 동작이라 iOS/macOS는 SPM을 끄고 기존 CocoaPods(Podfile) 경로만
  # 쓰도록 강제한다 — Podfile은 이미 platform :ios, '15.5'로 정확히 설정돼
  # 있어 Firebase 설치엔 문제없다.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons3d/
    - assets/CI.png
    - assets/web/address_search.html

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
